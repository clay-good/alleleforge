<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="70" y="28" fill="#1f2933" font-size="17" font-weight="700">Split-conformal recalibration restores interval coverage</text>
<text x="70" y="47" fill="#62707d" font-size="12">Coverage of a deliberately under-covering interval set, before vs after recalibration. Dashed: nominal</text>
<text x="70" y="62" fill="#62707d" font-size="12">target. Data: a seeded SYNTHETIC interval set constructed to be miscalibrated — this demonstrates the</text>
<text x="70" y="77" fill="#62707d" font-size="12">guarantee, it does not measure a model.</text>
