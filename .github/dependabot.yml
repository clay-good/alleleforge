# Dependabot keeps the four dependency surfaces patched (R0 supply-chain).
# Grouped, weekly PRs so the security signal is not lost in churn.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "maturin", "nbmake", "ipykernel"]
      python-runtime:
        patterns: ["*"]
        exclude-patterns: ["ruff", "mypy", "pytest*", "hypothesis", "maturin", "nbmake", "ipykernel"]

  # Rust crate dependencies (pyo3 is security-sensitive — kept current).
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The digest-pinned base image in the root Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Digest refreshes of the same Python line (security patches) still flow. A move to
    # a new Python minor is a deliberate decision, not a Dependabot bump: the image must
    # run an interpreter CI tests and pyproject classifies, and constraints/container.txt
    # is resolved for that interpreter. Bump all three together by hand.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The GitHub Actions pinned in the CI and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
