name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The contributor path, end to end, in one environment: `make install` then
    # `make ci`. Every other job installs its own subset and runs one member, which is
    # right for parallelism and blind to the thing this catches — whether the command
    # CONTRIBUTING tells a newcomer to run can run the gate it tells them to run.
    #
    # It could not, twice, and neither was visible here. `make install` omitted `core`,
    # so one `import polars` at module scope made `pytest` fail at *collection* and no
    # test ran; and it omitted `docs`, so `make docs` died with "mkdocs: No such file or
    # directory". Both were masked by a developer machine that had the packages from
    # some earlier hand-install. This job has no such history.
    #
    # Deliberately duplicated work. The other jobs give a fast, parallel, per-member
    # signal; this one answers a question none of them can, because the question is
    # about the environment rather than about the code.
    name: Gate (make install && make ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make install
      - run: make ci

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      # The served page's script had never been parsed by anything: seven tests read
      # it as text, there is no package.json and no JavaScript job, so a missing brace
      # shipped a dead form with every gate green. The suite parses it wherever node
      # exists; this step is what makes "wherever node exists" include CI, rather than
      # depending on the runner image happening to ship one.
      - run: node --check src/alleleforge/web/frontend/app.js

  type-check:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The genome deps are installed so the genome package type-checks against
      # the real pyfaidx / pyliftover modules.
      - run: pip install -e ".[dev,core,cli,web,genome-light]"
      - run: mypy --strict src/alleleforge

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install the Phase 2 genome dependencies (pyfaidx for FASTA access,
      # pyliftover for chain-file liftover) so tests/genome runs and counts
      # toward the coverage gate. The heavier genome stack (pysam, cyvcf2,
      # mappy) is pulled in by later phases that need it.
      - run: pip install -e ".[dev,core,cli,web,genome-light]"
      - run: pytest

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # mkdocstrings imports the package to render the API reference, so the
      # core install plus the genome deps (pyfaidx is a top-level import in the
      # genome layer) are needed alongside the docs toolchain.
      - run: pip install -e ".[docs,genome-light]"
      - run: mkdocs build --strict

  examples:
    name: Examples (notebooks, stub models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Examples run end to end against the weight-free stub models; the same
      # extras as the test job guarantee every transitive import resolves, and the
      # notebook runner (nbmake) ships in the dev extra. --no-cov disables the
      # library coverage gate for this notebook-only run.
      - run: pip install -e ".[dev,core,cli,web,genome-light]"
      - run: pytest --nbmake examples/ --no-cov

  reproduce:
    name: Reproducibility audit (re-derive & diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Re-derive the canonical weight-free design run from config + seed and diff
      # it against the committed golden manifest, proving the run is reproducible
      # and has not silently drifted.
      - run: pip install -e ".[dev,core,cli,web,genome-light]"
      - run: python scripts/reproduce.py

  security:
    name: Supply-chain audit (pip-audit · cargo audit)
    runs-on: ubuntu-latest
    # Advisory, not blocking — and *visibly* so. `|| true` inside the steps made a run
    # that found advisories report a green check, which is a passing audit that never
    # audited anything a reader can act on. `continue-on-error` keeps an unrelated PR
    # from turning red on a newly-published advisory (the reason this is advisory) while
    # letting the finding show up as a failure in the checks list. Tighten to blocking
    # before the v1.0 tag.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Audit the installed Python environment against the PyPI advisory DB, and the
      # Rust crate against RustSec. The advisory DBs move independently of our code, so
      # a newly-published advisory must not block an unrelated PR — Dependabot opens the
      # remediation PR — but it must be *visible*, which is what the job-level
      # `continue-on-error` above does and what `|| true` did not.
      - run: pip install -e ".[dev,core,cli,web,genome-light]" pip-audit
      - run: pip-audit --strict --desc
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: rust

  rust:
    name: Rust native crate (fmt · clippy · maturin · parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # fmt + clippy gate the source. The `extension-module` feature means a bare
      # `cargo build` cannot link libpython, so maturin — not cargo — is the build
      # of record; it also keeps the pinned, security-patched pyo3 building.
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --lib -- -D warnings
        working-directory: rust
      # Build the wheel, install it alongside the library, and run the native
      # parity tests so the Rust FM-index is proven byte-identical to the
      # pure-Python fallback (not just compiled).
      # The same set `make install` uses: this job runs the WHOLE suite (below), and
      # 56 test files import typer at module scope and 17 import fastapi — without
      # them `pytest` fails at *collection* and no test runs at all.
      - run: pip install -e ".[dev,core,cli,web,genome-light]"
      - run: maturin build --release --out dist
        working-directory: rust
      - run: pip install rust/dist/*.whl
      # The WHOLE suite, not `-m native`. With the crate installed the library takes
      # its native branches everywhere, and that is the configuration the docs
      # recommend for real work — yet every other job runs the pure-Python one, so
      # nothing exercised the shipped configuration end to end. It has bitten before:
      # with the crate built, `FMIndex.build` once dispatched to the extension and
      # silently dropped `cache_dir`, `rebuild`, `occ_rate` and `sa_rate`, which no
      # `native`-marked test covered. The parity tests prove the kernels agree; this
      # proves the library around them still behaves.
      - run: pytest --no-cov
